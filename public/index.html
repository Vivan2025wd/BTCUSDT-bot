<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0e17">
    <title>Privacy Trading Bot — Local Control</title>
    <style>
        /* ============ RESET / BASE ============ */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter',
                'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
            background-color: #0a0e17;
            color: #e2e8f0;
        }

        #root {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ============ AMBIENT BACKGROUND ============ */
        .bg-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-glow::before,
        .bg-glow::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
        }

        .bg-glow::before {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #6366f1 0%, transparent 70%);
            top: -200px;
            left: -100px;
            animation: float-slow 18s ease-in-out infinite;
        }

        .bg-glow::after {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
            bottom: -250px;
            right: -150px;
            animation: float-slow 22s ease-in-out infinite reverse;
        }

        @keyframes float-slow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(40px, -30px) scale(1.1); }
        }

        /* Subtle grid overlay */
        .bg-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        }

        /* ============ LOADING SCREEN ============ */
        .loading-screen {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 32px;
            padding: 24px;
        }

        /* Brand mark */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            animation: fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand-icon {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.08));
            box-shadow:
                0 0 0 1px rgba(99, 102, 241, 0.25),
                0 20px 60px -20px rgba(99, 102, 241, 0.5);
        }

        .brand-icon::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.6), rgba(139, 92, 246, 0.2), transparent 60%);
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .brand-icon svg {
            width: 34px;
            height: 34px;
            stroke: #a5b4fc;
            stroke-width: 1.75;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #f8fafc;
            margin: 0;
        }

        .brand-title span {
            color: #64748b;
            font-weight: 400;
        }

        .brand-subtitle {
            font-size: 12px;
            font-weight: 500;
            color: #64748b;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-subtitle::before,
        .brand-subtitle::after {
            content: '';
            width: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #334155);
        }

        .brand-subtitle::after {
            background: linear-gradient(90deg, #334155, transparent);
        }

        /* Spinner */
        .spinner-wrap {
            position: relative;
            width: 56px;
            height: 56px;
            animation: fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s backwards;
        }

        .spinner-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        /* Outer ring — slow indigo */
        .spinner-ring.outer {
            border-top-color: #6366f1;
            border-right-color: rgba(99, 102, 241, 0.3);
            animation: spin 1.6s cubic-bezier(0.6, 0.05, 0.4, 0.95) infinite;
        }

        /* Inner ring — faster violet, reverse */
        .spinner-ring.inner {
            inset: 10px;
            border-bottom-color: #8b5cf6;
            border-left-color: rgba(139, 92, 246, 0.25);
            animation: spin 1.1s cubic-bezier(0.6, 0.05, 0.4, 0.95) infinite reverse;
        }

        /* Center pulse */
        .spinner-core {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            margin: -4px 0 0 -4px;
            border-radius: 50%;
            background: #a5b4fc;
            box-shadow: 0 0 12px rgba(165, 180, 252, 0.9);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1);   opacity: 1;   }
            50%      { transform: scale(0.6); opacity: 0.4; }
        }

        /* Status text */
        .status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s backwards;
        }

        .status-text {
            font-size: 13px;
            color: #94a3b8;
            margin: 0;
            font-weight: 500;
        }

        .status-text .dots span {
            display: inline-block;
            animation: dot-bounce 1.4s ease-in-out infinite;
            opacity: 0.5;
        }

        .status-text .dots span:nth-child(2) { animation-delay: 0.2s; }
        .status-text .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dot-bounce {
            0%, 80%, 100% { opacity: 0.4; transform: translateY(0); }
            40%           { opacity: 1;   transform: translateY(-3px); }
        }

        /* Progress bar */
        .progress {
            width: 200px;
            height: 2px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress::after {
            content: '';
            position: absolute;
            inset: 0;
            width: 40%;
            background: linear-gradient(90deg,
                transparent,
                #6366f1 30%,
                #8b5cf6 70%,
                transparent
            );
            border-radius: 999px;
            animation: progress-slide 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        @keyframes progress-slide {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }

        /* Bottom meta */
        .meta {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 11px;
            color: #475569;
            font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace;
            animation: fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s backwards;
            z-index: 1;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-item::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #334155;
        }

        .meta-item.ok::before {
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }

        .meta-item.loading::before {
            background: #6366f1;
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0);   }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <noscript>
        <div style="padding: 40px; text-align: center; color: #94a3b8; font-family: sans-serif;">
            <h2 style="color: #e2e8f0;">JavaScript Required</h2>
            <p>Privacy Trading Bot needs JavaScript enabled to run.</p>
        </div>
    </noscript>

    <!-- Ambient background layers -->
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>

    <div id="root">
        <div class="loading-screen">

            <!-- Brand -->
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 12h4l3-9 4 18 3-9h4"/>
                    </svg>
                </div>
                <div style="text-align: center;">
                    <h1 class="brand-title">Privacy Trading Bot <span>· Local Control</span></h1>
                    <p class="brand-subtitle">Self-Hosted</p>
                </div>
            </div>

            <!-- Spinner -->
            <div class="spinner-wrap" aria-hidden="true">
                <div class="spinner-ring outer"></div>
                <div class="spinner-ring inner"></div>
                <div class="spinner-core"></div>
            </div>

            <!-- Status -->
            <div class="status" role="status" aria-live="polite">
                <p class="status-text">
                    Loading<span class="dots"><span>.</span><span>.</span><span>.</span></span>
                </p>
                <div class="progress"></div>
            </div>

        </div>
    </div>

    <!-- Bottom meta bar -->
    <div class="meta">
        <span class="meta-item ok">Local Storage</span>
        <span class="meta-item loading" id="react-status">React Runtime</span>
        <span class="meta-item">AES-256 Encryption</span>
    </div>

    <script>
        // Global error handler for debugging
        window.addEventListener('error', function (e) {
            console.error('Global error:', e.error);
        });

        window.addEventListener('unhandledrejection', function (e) {
            console.error('Unhandled rejection:', e.reason);
        });

        console.log(
            '%cPrivacy Trading Bot %cstarting…',
            'color:#a5b4fc;font-weight:600;font-size:12px;',
            'color:#64748b;font-size:12px;'
        );

        // Update meta status when React mounts
        // React will replace #root, so we poll briefly
        (function watchReactMount() {
            const root = document.getElementById('root');
            const reactStatus = document.getElementById('react-status');
            const start = Date.now();

            const check = () => {
                if (!root || !root.firstElementChild ||
                    !root.querySelector('.loading-screen')) {
                    if (reactStatus) {
                        reactStatus.classList.remove('loading');
                        reactStatus.classList.add('ok');
                        reactStatus.textContent = 'React Runtime';
                    }
                    return;
                }
                if (Date.now() - start > 15000) {
                    if (reactStatus) {
                        reactStatus.textContent = 'React (slow)';
                    }
                    return;
                }
                requestAnimationFrame(check);
            };

            check();
        })();
    </script>
</body>
</html>
